<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>suma</title>

        <link rel="stylesheet"
        href="{{url_for/('static', filename='css/estilos.css') }}">
    </head>
    <body>

        <header class="encabezado">
            <h1>Calculadora basica con Flask</h1>

            <nav class="menu">
                <a href="/suma">Suma</a>
                <a href="/resta">Resta</a>
                <a href="/multiplicacion"></a>
                <a href="/divicion"></a>
            </nav>
        </header>

        <main class="contenedor">
            <section class="tarjeta-operacion">
                <h2>Suma</h2>

                <form method="POST">
                    <Label for="numero1">Primer numero</Label>
                    <input id="numero1" name="numero1"
                    type="number" step="any" required>

                    <label for="numero2">Segundo numero</label>
                    <input id="numero2" name="numero2"
                    type="number" step="any" required>

                    <button class="boton" type="submit">
                        calcular suma
                    </button>
                </form>

                {% if resultado is not none %}
                <p class="resultado">
                    resultado: {{ resultado }}
                </p>
            </section>
        </main>
    </body>
</html>
